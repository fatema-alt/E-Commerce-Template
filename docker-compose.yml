services:
  postgres:
    image: postgres:17-alpine
    container_name: commerce-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: commerce
      POSTGRES_PASSWORD: commerce_dev_password
      POSTGRES_DB: commerce_db

    ports:
      - "127.0.0.1:5434:5432"

    volumes:
      - commerce_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U commerce -d commerce_db
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  commerce_postgres_data:
